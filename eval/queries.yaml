  - id: q7
    text: >
      If $10,000 was invested in SPY on 2020-01-02, what would the portfolio value be
      on 2024-12-31? Retrieve SPY's adjusted closing price on both dates from market
      price history (the tool returns dividend-adjusted prices) and compute the ending
      value as ($10,000 / opening adjusted price) × closing adjusted price. Report the
      dollar figure only.
      Answer format: "SPY portfolio value on 2024-12-31: $xx,xxx"
    grader: numeric
    ground_truth: 19000.0
    tolerance_pct: 5.0
    minimum_tools: 5
    required_tools: [finance_kb, get_market_history, calculator, web_search, search_wikipedia]
    data_as_of: "2026-04-22"

