      beta from market fundamentals. Estimate WACC using CAPM with the current 10-year
      Treasury yield and a 5.5% equity risk premium. Apply a two-stage DCF: 5 years at
      8% FCF growth, terminal growth rate of 3%. Report the per-share dollar value only. 
      Answer format: "Apple intrinsic value per share: $xxx.xx"
    grader: numeric
    definition_keywords: ["discount", "cash flow", "terminal", "present value", "intrinsic"]
