queries:
  - id: q1
    text: >
      What was NVIDIA's Return on Equity (ROE) for FY2023? Use market financial data
      for net income and revenue, the most recent 10-K filing for total assets, and
      market fundamentals for shareholders' equity. Compute ROE using the DuPont
      three-factor model and report the final percentage figure only.
      Answer format: "NVIDIA ROE for FY2023: xx.x%"
    grader: numeric
    definition_keywords: ["return", "equity", "margin", "turnover", "multiplier"]
    ground_truth: 20.0
    tolerance_pct: 15.0
    minimum_tools: 5
    required_tools: [finance_kb, get_market_financials, query_filing_documents, get_market_fundamentals, calculator, web_search]
    data_as_of: "2026-04-22"

  - id: q2
    text: >
      What was Apple's Weighted Average Cost of Capital (WACC) as of end-2024? Retrieve
      Apple's beta and debt-to-equity ratio from market fundamentals, annual interest
      expense and total debt from the most recent 10-K, and the current 10-year US
      Treasury yield as the risk-free rate. Assume a 5.5% equity risk premium and use
      CAPM for cost of equity. Report the final WACC percentage only.
      Answer format: "Apple WACC as of end-2024: xx.x%"
    grader: numeric
    definition_keywords: ["weighted", "average", "cost", "capital", "discount"]
    ground_truth: 7.0
    tolerance_pct: 30.0
    minimum_tools: 5
    required_tools: [ finance_kb, get_market_fundamentals, query_filing_documents, web_search, calculator]
    data_as_of: "2026-04-22"

